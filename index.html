<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082759">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Viáticos Sistronic</title>
<style>
/* Layout: app de una columna, barra superior con el viaje activo, pestañas abajo, botón flotante para registrar gasto */
:root {
  --navy: #082759;
  --navy-2: #1b3f7a;
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #eaeef5;
  --fg: #142033;
  --muted: #5d6a80;
  --line: #d7dde8;
  --accent: #082759;
  --on-accent: #ffffff;
  --brand-red: #e20214;
  --amber: #b26b00;
  --amber-bg: #fff1d6;
  --green: #1f7a4a;
  --green-bg: #dcf3e5;
  --red: #b3261e;
  --red-bg: #fde3e1;
  --blue-bg: #e1e9f7;
  --gray-bg: #eceef2;
  --font: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1420; --surface: #152033; --surface-2: #1d2a41; --fg: #e6ebf3; --muted: #9aa7bd; --line: #2a3850;
    --accent: #8fb3ff; --on-accent: #08142a; --navy-2: #2a4f8f;
    --amber: #ffc25c; --amber-bg: #3a2c10; --green: #6fd49c; --green-bg: #12321f; --red: #ff8f86; --red-bg: #3d1714;
    --blue-bg: #1b2c4c; --gray-bg: #232c3b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1420; --surface: #152033; --surface-2: #1d2a41; --fg: #e6ebf3; --muted: #9aa7bd; --line: #2a3850;
  --accent: #8fb3ff; --on-accent: #08142a; --navy-2: #2a4f8f;
  --amber: #ffc25c; --amber-bg: #3a2c10; --green: #6fd49c; --green-bg: #12321f; --red: #ff8f86; --red-bg: #3d1714;
  --blue-bg: #1b2c4c; --gray-bg: #232c3b; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #fff;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px;
}
.brand-chip { flex: 0 0 auto; background: #fff; border-radius: 10px; padding: 5px 9px; display: flex; align-items: center; box-shadow: 0 1px 0 rgba(0,0,0,.15); position: relative; overflow: hidden; }
.brand-chip img { height: 34px; width: auto; display: block; }
.brand-chip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, #082759 0 50%, #e20214 50% 100%); }
.topbar { border-bottom: 3px solid #e20214; }
.splash { position: fixed; inset: 0; z-index: 100; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .35s ease, visibility .35s; }
.splash img { width: min(62vw, 280px); height: auto; }
.splash-t { color: #082759; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 12px; }
.splash-bar { width: 120px; height: 4px; border-radius: 2px; background: #e8ecf3; overflow: hidden; }
.splash-bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #082759, #e20214); animation: sb 1s ease-in-out infinite alternate; }
@keyframes sb { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.splash.out { opacity: 0; visibility: hidden; }
.trip-btn { flex: 1; min-width: 0; text-align: left; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; border-radius: 10px; padding: 6px 10px; cursor: pointer; }
.trip-btn b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.trip-btn small { display: block; opacity: .75; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; max-width: 900px; margin: 0 auto; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 700; }
h2:first-child { margin-top: 4px; }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(3, minmax(0,1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
.kpi .l { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.kpi .v { font-size: 19px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.hero { grid-column: 1 / -1; background: var(--navy); border-color: var(--navy); color: #fff; display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.kpi.hero .l { color: rgba(255,255,255,.75); }
.kpi.hero .v { font-size: 28px; }
.kpi.hero .meter { flex-basis: 100%; height: 6px; background: rgba(255,255,255,.2); border-radius: 3px; overflow: hidden; }
.kpi.hero .meter i { display: block; height: 100%; background: linear-gradient(90deg, #f2a900, #e20214); }
.kpi.warn .v { color: var(--amber); }
.kpi.neg .v { color: var(--red); }

.list { display: flex; flex-direction: column; gap: 6px; }
.day { font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 2px 2px; display: flex; justify-content: space-between; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.item:active { background: var(--surface-2); }
.item .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .a { font-weight: 700; text-align: right; }
.item .s { color: var(--muted); font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px; border-radius: 999px; white-space: nowrap; justify-self: end; }
.st-LEGALIZADO { background: var(--green-bg); color: var(--green); }
.st-PENDIENTE { background: var(--amber-bg); color: var(--amber); }
.st-NO { background: var(--gray-bg); color: var(--muted); }
.st-SIS { background: var(--blue-bg); color: var(--accent); }

.empty { text-align: center; color: var(--muted); padding: 30px 10px; border: 1px dashed var(--line); border-radius: var(--radius); }

.fab { position: fixed; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--brand-red); color: #fff; border: 0; border-radius: 16px; padding: 14px 18px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.fab svg { width: 20px; height: 20px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { background: none; border: 0; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button { position: relative; }
.tabs button[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.tabs button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand-red); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.total td { font-weight: 700; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; margin-top: 4px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--accent); }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; cursor: pointer; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 11px; min-height: 44px; }
.field input:focus, .field select:focus, .field textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.val-input { font-size: 22px !important; font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--red); border-color: var(--red); background: transparent; }
.btn.block { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }

/* Hoja inferior para formularios */
.sheet-back { position: fixed; inset: 0; background: rgba(5,12,25,.5); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 94%; overflow-y: auto; border-radius: 18px 18px 0 0; padding-block: 0 calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet-head { position: sticky; top: 0; background: var(--bg); padding: 14px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 2; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.x { background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; padding: 4px 8px; color: var(--muted); }
.photo-prev { max-height: 220px; border-radius: 10px; border: 1px solid var(--line); display: block; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 60; font-weight: 600; max-width: 90%; }
.note { background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
.ok { background: var(--green-bg); color: var(--green); }

.trip-list .item { grid-template-columns: 1fr auto; }
.trip-list .item.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

/* Formato FO-AD-03 */
.fo { background: #fff; color: #000; border: 1px solid #999; padding: 14px; font-size: 12px; min-width: 620px; }
.fo table { font-size: 12px; }
.fo td, .fo th { border: 1px solid #000; padding: 4px 6px; color: #000; background: #fff; }
.fo th { background: #082759; color: #fff; font-size: 10.5px; }
.fo .lbl { background: #dfe6f2; font-weight: 700; font-size: 10.5px; text-transform: uppercase; }
.fo .head td { vertical-align: middle; }
.fo .title { font-size: 17px; font-weight: 700; text-align: center; }
.fo .sign td { height: 60px; vertical-align: bottom; text-align: center; font-weight: 700; }
.fo-wrap { overflow-x: auto; border-radius: var(--radius); }

@media print {
  body { background: #fff; }
  body::before, .splash, .topbar, .tabs, .fab, .no-print, .sheet-back, .toast { display: none !important; }
  main { padding: 0 !important; max-width: none; }
  .fo-wrap { overflow: visible; }
  .fo { border: 0; min-width: 0; padding: 0; }
  @page { size: letter; margin: 12mm; }
}
@media (prefers-reduced-motion: no-preference) { .sheet.anim { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .6; } } }

.ia-busy { display: flex; align-items: center; gap: 10px; background: var(--blue-bg); color: var(--accent); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn[disabled] { opacity: .5; }
details summary { color: var(--accent); }

.login { position: fixed; inset: 0; z-index: 90; background: #fff; color: #142033; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding-block: max(24px, env(safe-area-inset-top, 0px)) 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.login-in { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.login-logo { width: 72%; margin: 0 auto 6px; }
.login h1 { font-size: 18px; margin: 0; color: #082759; letter-spacing: .02em; }
.login p { margin: 0; color: #5d6a80; font-size: 14px; }
.login .note { text-align: left; }
.login .btn { min-height: 50px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.login .btn.primary { background: #082759; border-color: #082759; color: #fff; }
.login .btn:not(.primary) { background: #fff; color: #082759; border-color: #d7dde8; }
.login .g { background: #fff; color: #082759; border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; }
.login .hint { color: #5d6a80; }

/* Perfil y configuración */
.avatar-btn { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; color: #fff; padding: 0; cursor: pointer; max-width: 64px; }
.avatar-btn .who { font-size: 11px; opacity: .85; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar-btn .who b { font-weight: 600; }
.avatar { position: relative; width: 36px; height: 36px; border-radius: 50%; background: #e20214; color: #fff; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.avatar .ini { font-weight: 700; font-size: 14px; letter-spacing: .5px; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.avatar.gear { background: rgba(255,255,255,.12); }
.avatar.gear svg { width: 20px; height: 20px; }
.avatar.xl { width: 56px; height: 56px; box-shadow: none; }
.avatar.xl .ini { font-size: 20px; }
.perfil-card { display: flex; align-items: center; gap: 12px; }
.perfil-card .pc-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.perfil-card .pc-txt b { font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.perfil-card .pc-txt span { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Total gastado y gráfica por día */
.kpi.total-kpi { grid-column: 1 / -1; border-left: 4px solid #e20214; }
.kpi.total-kpi .v { font-size: 24px; }
.kpi .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chart-dias { padding: 12px 10px 10px; }
.cd-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.cd-bars { display: flex; align-items: stretch; gap: 6px; height: 210px; padding: 0 2px; }
.cd-col { flex: 1 1 0; min-width: 40px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.cd-v { font-size: 10.5px; font-weight: 700; color: var(--ink, #1a1a1a); white-space: nowrap; min-height: 14px; }
.cd-track { flex: 1; width: 70%; max-width: 34px; display: flex; align-items: flex-end; background: var(--surface-2); border-radius: 6px 6px 0 0; }
.cd-track i { display: block; width: 100%; min-height: 2px; background: #082759; border-radius: 6px 6px 0 0; }
.cd-col.top .cd-track i { background: #e20214; }
.cd-d { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.2; }
.cd-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.cd-foot b { color: var(--ink, inherit); }

.note.dup { background: #fdecec; border-color: #f5b5b5; color: #8a1010; }
.rev-card { margin-top: 0; }

/* Datos completos de la factura */
.fx-box { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: 0 12px; }
.fx-box > summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; justify-content: space-between; }
.fx-box > summary::-webkit-details-marker { display: none; }
.fx-box > summary::after { content: "▾"; color: var(--muted); transition: transform .2s; }
.fx-box[open] > summary::after { transform: rotate(180deg); }
.fx-box[open] { padding-bottom: 12px; }
.fx-box .field, .fx-box .grid2 { margin-top: 8px; }
.fx-sec { margin-top: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.row:empty { display: none; }

/* Cortes de mes */
.corte-row { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); }
.corte-row + .corte-row { margin-top: 8px; }
.corte-row.nuevo { border-style: dashed; border-color: var(--accent); }
.corte-row .row .btn { flex: 1 1 auto; }
/* Estado de sincronización con la cuenta de Google */
#sync-chip:empty { display: none; }
#sync-chip { display: flex; justify-content: flex-end; margin: -4px 0 6px; }
.sync-chip { border: 0; background: transparent; color: #5b6b85; font: inherit; font-size: 12px; padding: 4px 2px; cursor: pointer; }
.sync-chip.s-auth, .sync-chip.s-espera, .sync-chip.s-error { color: #9a5b00; font-weight: 600; }
.sync-chip.s-offline { color: #7a7a7a; }

/* Conceptos de gasto */
.cp-bar { display: flex; gap: 8px; margin: 4px 0 12px; }
.cp-bar input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: inherit; }
.cp-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.cp-card.cp-off { opacity: .7; }
.cp-card.cp-off .cp-ic { filter: grayscale(1); }
.cp-head { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: 0; text-align: left; color: var(--fg); font: inherit; cursor: pointer; }
.cp-ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 22px; flex: none; }
.cp-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cp-t b { font-size: 15px; }
.cp-t small { color: var(--muted); font-size: 12px; margin-top: 2px; }
.cp-more { color: var(--muted); font-size: 13px; white-space: nowrap; }
.cp-subs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; align-items: center; }
.cp-chip { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); border: 1px solid transparent; font-family: inherit; }
.cp-chip.off { text-decoration: line-through; color: var(--muted); background: transparent; border-color: var(--line); }
.cp-chip.add { background: transparent; border: 1px dashed var(--brand-red); color: var(--brand-red); font-weight: 600; cursor: pointer; }
.cp-add-in { display: flex; gap: 6px; width: 100%; }
.cp-add-in input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; }
.cp-iconos { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; }
.cp-iconos button { height: 42px; font-size: 21px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.cp-iconos button[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--blue-bg); }
.cp-colores { display: flex; flex-wrap: wrap; gap: 8px; }
.cp-colores button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.cp-colores button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.cp-lista { display: flex; flex-direction: column; gap: 6px; }
.cp-sub { display: flex; align-items: center; gap: 4px; }
.cp-sub input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); font: inherit; }
.cp-sub.off input { color: var(--muted); text-decoration: line-through; background: var(--surface-2); }
.ib { width: 34px; height: 34px; flex: none; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 14px; cursor: pointer; padding: 0; }
.ib:disabled { opacity: .35; cursor: default; }

/* Escáner de facturas */
.scan-back { position: fixed; inset: 0; z-index: 50; background: #0b1220; display: flex; justify-content: center; }
.scan { width: 100%; max-width: 640px; height: 100%; display: flex; flex-direction: column; color: #fff; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.scan-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 17px; }
.scan-head .x { color: #fff; }
.scan-tip { margin: 0 16px 8px; font-size: 13px; color: #b8c2d6; }
.scan-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 16px; position: relative; }
.scan-stage > img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.5); background: #fff; }
.scan-wait { display: flex; gap: 10px; align-items: center; color: #b8c2d6; }
.scan-crop { position: relative; touch-action: none; }
.scan-crop img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
.scan-crop svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.scan-crop polygon { fill: rgba(226,2,20,.12); stroke: #e20214; stroke-width: 4; vector-effect: non-scaling-stroke; }
.scan-h { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(255,255,255,.95); border: 3px solid #e20214; box-shadow: 0 2px 8px rgba(0,0,0,.5); touch-action: none; cursor: grab; }
.scan-h::after { content: ""; position: absolute; inset: -12px; }
.scan-seg { margin: 6px 16px 0; }
.scan-foot { display: flex; gap: 8px; padding: 12px 16px 16px; }
.scan-foot .btn { flex: 1; }
.scan-foot .btn:not(.primary) { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.25); }
.scan-seg { justify-content: center; }
.scan-seg button { color: #fff; background: transparent; border-color: rgba(255,255,255,.3); }
.scan-seg button[aria-pressed="true"] { background: #fff; color: #082759; border-color: #fff; }

:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
</style>
</head>

const fmtCOP = n => { const x = Math.round(Number(n) || 0); return (x < 0 ? '-$ ' : '$ ') + Math.abs(x).toLocaleString('es-CO'); };

const parseISO = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtFecha = s => { const d = parseISO(s); return d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : ''; };

/* ---------- Almacenamiento (IndexedDB con respaldo en localStorage) ---------- */
const DB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('viaticos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function get(k) {
    try {
      const db = await open();
      return await new Promise((res, rej) => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
    } catch { try { const v = localStorage.getItem('viaticos:' + k); return v ? JSON.parse(v) : undefined; } catch { return undefined; } }
  }
  async function set(k, v) {
    try {
      const db = await open();
      await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
    } catch { try { localStorage.setItem('viaticos:' + k, JSON.stringify(v)); } catch {} }
  }
  async function del(k) {
    try { const db = await open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); }
    catch { try { localStorage.removeItem('viaticos:' + k); } catch {} }
  }
  return { get, set, del };
})();

/* ---------- Cálculos (equivalentes a las fórmulas del Excel) ---------- */
function estado(g) {
  if (g.valor === '' || g.valor == null) return '';
  if (g.pagadoPor === 'Sistronic') return 'PAGADO POR SISTRONIC';
  if (g.soporte === 'Excepción') return 'NO REQUIERE SOPORTE';
  if (g.soporte !== 'Sí') return 'PENDIENTE';
  return 'LEGALIZADO';
}
const chipClass = e => e === 'LEGALIZADO' ? 'st-LEGALIZADO' : e === 'PENDIENTE' ? 'st-PENDIENTE' : e === 'PAGADO POR SISTRONIC' ? 'st-SIS' : 'st-NO';
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const conValor = v => v.gastos.filter(g => g.valor !== '' && g.valor != null);

function diasServicio(v) {
  const a = parseISO(v.inicio), b = parseISO(v.fin);
  return a && b ? Math.round((b - a) / 86400000) + 1 : '';
}
function indicadores(v) {
  const gs = conValor(v);
  const emp = gs.filter(g => g.pagadoPor !== 'Sistronic');
  const anticipo = Number(v.anticipo) || 0;
  const gastado = sum(emp, g => g.valor);
  return {
    anticipo, gastado, saldo: anticipo - gastado,
    sistronic: sum(gs.filter(g => g.pagadoPor === 'Sistronic'), g => g.valor),
    conSoporte: sum(emp.filter(g => g.soporte === 'Sí'), g => g.valor),
    pendiente: sum(gs.filter(g => estado(g) === 'PENDIENTE'), g => g.valor),
    total: sum(gs, g => g.valor),
    ejecutado: anticipo ? gastado / anticipo : 0
  };
}
function resumen(v) {
  const gs = conValor(v), I = indicadores(v);
  const conceptos = Object.keys(S.listas);
  const porConcepto = conceptos.map(c => ({ c, t: sum(gs.filter(g => g.concepto === c), g => g.valor) }));
  // otros conceptos no listados
  [...new Set(gs.map(g => g.concepto).filter(c => c && !conceptos.includes(c)))].forEach(c => porConcepto.push({ c, t: sum(gs.filter(g => g.concepto === c), g => g.valor) }));
  const totalConc = sum(porConcepto, x => x.t);
  // concepto + subconcepto, ordenado por orden de concepto y luego total desc
  const m = new Map();
  gs.filter(g => g.concepto).forEach(g => { const k = g.concepto + '\u0000' + (g.sub || ''); const o = m.get(k) || { c: g.concepto, s: g.sub || '', n: 0, t: 0 }; o.n++; o.t += Number(g.valor) || 0; m.set(k, o); });
  const ord = c => { const i = conceptos.indexOf(c); return i < 0 ? 99 : i; };
  const porSub = [...m.values()].sort((a, b) => ord(a.c) - ord(b.c) || b.t - a.t);
  // por día (inicio -> fin, máx 31)
  const dias = [];
  const a = parseISO(v.inicio), b = parseISO(v.fin);
  if (a) for (let d = new Date(a), i = 0; i < 31 && (!b || d <= b); i++, d.setDate(d.getDate() + 1)) {
    const iso = toISO(d), del = gs.filter(g => g.fecha === iso);
    dias.push({ f: iso, t: sum(del, g => g.valor), n: del.length });
  }
  const totDias = sum(dias, x => x.t);
  const fuera = I.total - totDias;
  const mayor = dias.reduce((m, x) => x.t > (m?.t || 0) ? x : m, null);
  // por proveedor
  const pm = new Map();
  gs.forEach(g => { const k = g.proveedor || '(sin proveedor)'; const o = pm.get(k) || { p: k, t: 0, n: 0 }; o.t += Number(g.valor) || 0; o.n++; pm.set(k, o); });
  const porProv = [...pm.values()].sort((x, y) => y.t - x.t);
  return { I, porConcepto, totalConc, porSub, dias, totDias, fuera, mayor, porProv };
}
function facturas(v) {
  const gs = conValor(v);
  const por = {};
  ESTADOS.forEach(e => { const x = gs.filter(g => estado(g) === e); por[e] = { t: sum(x, g => g.valor), n: x.length }; });
  return {
    por,
    total: { t: sum(gs, g => g.valor), n: gs.length },
    aLegalizar: { t: por['LEGALIZADO'].t + por['PENDIENTE'].t + por['NO REQUIERE SOPORTE'].t, n: por['LEGALIZADO'].n + por['PENDIENTE'].n + por['NO REQUIERE SOPORTE'].n },
    faltantes: por['PENDIENTE'].n
  };
}
function legalizacion(v) {
  const gs = conValor(v).filter(g => g.pagadoPor !== 'Sistronic');
  const m = new Map();
  gs.forEach(g => {
    const k = (g.sub || g.concepto || '').trim();
    const o = m.get(k) || { d: k, n: 0, t: 0, f: new Set() };
    o.n++; o.t += Number(g.valor) || 0; if (g.factura) o.f.add(g.factura); m.set(k, o);
  });
  const lineas = [...m.values()].sort((a, b) => a.d.localeCompare(b.d, 'es')).map(o => ({
    d: o.d, n: o.n, t: o.t, unit: o.n ? o.t / o.n : 0,
    f: o.f.size === 0 ? 'Sin factura' : o.f.size === 1 ? [...o.f][0] : `${o.f.size} facturas`
  }));
  const total = sum(lineas.slice(0, MAX_LINEAS_FO), l => l.t);
  const I = indicadores(v);
  let aviso, ok = false;
  if (lineas.length > MAX_LINEAS_FO) aviso = `⚠ ${lineas.length} conceptos: el formato tiene ${MAX_LINEAS_FO} líneas`;
  else if (total !== I.gastado) aviso = '⚠ Total no cuadra con Control de Gastos';
  else { aviso = '✔ Cuadra con Control de Gastos'; ok = true; }
  return { lineas, total, aviso, ok, anticipo: I.anticipo, diferencia: I.anticipo - total };
}

function vGastos(v) {
  const I = indicadores(v);
  const pct = Math.min(100, Math.max(0, I.ejecutado * 100));
  let h = `<h2>Control de gastos</h2>
  <div class="kpis">
    <div class="kpi hero ${I.saldo < 0 ? 'neg' : ''}"><div><div class="l">Saldo disponible</div><div class="v num">${fmtCOP(I.saldo)}</div></div>
      <div style="text-align:right"><div class="l">Anticipo</div><div class="num" style="font-weight:700">${fmtCOP(I.anticipo)}</div></div>
      <div class="meter" title="Anticipo ejecutado"><i style="width:${pct}%"></i></div>
      <div class="l" style="flex-basis:100%">${fmtPct(I.ejecutado)} del anticipo ejecutado · ${diasServicio(v) || 0} días de servicio</div></div>
    <div class="kpi total-kpi"><div class="l">Total de viáticos gastados</div><div class="v num">${fmtCOP(I.total)}</div><div class="s">${conValor(v).length} gastos · empleado + Sistronic</div></div>
    <div class="kpi"><div class="l">Gastado por empleado</div><div class="v num">${fmtCOP(I.gastado)}</div></div>
    <div class="kpi"><div class="l">Pagado por Sistronic</div><div class="v num">${fmtCOP(I.sistronic)}</div></div>
    <div class="kpi"><div class="l">Con soporte (empleado)</div><div class="v num">${fmtCOP(I.conSoporte)}</div></div>
    <div class="kpi ${I.pendiente ? 'warn' : ''}"><div class="l">Pendiente de soporte</div><div class="v num">${fmtCOP(I.pendiente)}</div></div>
  </div>
  <h2>Gastos registrados (${v.gastos.length})</h2>`;
  if (!v.gastos.length) return h + `<div class="empty">Todavía no hay gastos en este viaje.<br>Toque <b>Registrar gasto</b> para agregar el primero.</div>`;
  const orden = [...v.gastos].sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
  let dia = null;
  h += '<div class="list">';
  for (const g of orden) {
    if (g.fecha !== dia) {
      dia = g.fecha;
      const tot = sum(v.gastos.filter(x => x.fecha === dia), x => x.valor);
      h += `<div class="day"><span>${fmtDia(dia)}</span><span class="num">${fmtCOP(tot)}</span></div>`;
    }
    const e = estado(g);
    h += `<button class="item" data-edit="${g.id}">
      <span class="t">${esc(g.sub || g.concepto)}${g.proveedor ? ' · ' + esc(g.proveedor) : ''}</span><span class="a num">${fmtCOP(g.valor)}</span>
      <span class="s">${esc(g.desc || g.concepto)}${g.factura ? ' · Fact. ' + esc(g.factura) : ''}${g.foto ? ' · 📷' : ''}${g.corte && corteDeGasto(g) ? ' · 🔒 Corte ' + corteDeGasto(g).n : ''}</span><span class="chip ${chipClass(e)}">${e === 'PAGADO POR SISTRONIC' ? 'SISTRONIC' : e}</span>
    </button>`;
  }
  return h + '</div>';
}

/* Estado de revisión del viaje */
const REV = { enviado: ['Enviado a revisión', 'st-SIS'], aprobado: ['Aprobado', 'st-LEGALIZADO'], devuelto: ['Devuelto', 'st-PENDIENTE'] };
const firmaViaje = v0 => { const v = vistaAbierta(v0), gs = conValor(v); return gs.length + ':' + sum(gs, g => g.valor) + ':' + gs.map(g => g.id + (g.factura || '') + g.valor).join('').length; };
const fmtFH = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const chipRev = v => { const r = v.revision; return r && REV[r.estado] ? `<span class="chip ${REV[r.estado][1]}">${REV[r.estado][0].toUpperCase()}</span>` : '<span class="chip st-NO">SIN ENVIAR</span>'; };
function marcarRevision(v, estado, nota = '') {
  const prev = v.revision || {};
  v.revision = { estado, nota, fecha: new Date().toISOString(), firma: estado === 'enviado' ? firmaViaje(v) : (prev.firma || firmaViaje(v)), historial: [...(prev.historial || []), { estado, nota, fecha: new Date().toISOString() }].slice(-20) };
}
let revDevolviendo = false;
function vRevision(v) {
  const r = v.revision;
  const cambio = r && r.estado !== 'aprobado' && r.firma && r.firma !== firmaViaje(v);
  let h = `<div class="card form rev-card">

      ultimo = { r, j };

      if (r.status === 400 || r.status === 401 || r.status === 403) return r;
      if (r.status === 429 || r.status >= 500) {

function comprimirFoto(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1280, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);

        res(c.toDataURL('image/jpeg', 0.72));
      };
      im.onerror = rej; im.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);

}

async function entregarArchivo(blob, nombre) {
  if (window.Android && Android.saveFile) {
    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });

  }
  if (/\.xlsx$/i.test(nombre)) blob = new Blob([await zipCrcFix(new Uint8Array(await blob.arrayBuffer()))], { type: blob.type });
  // En Android intenta abrir el menú Compartir (WhatsApp, correo, Drive); si no, descarga.
  try {
    const file = new File([blob], nombre, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: nombre }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast('Archivo descargado: ' + nombre);
}
function pedirArchivo(accept) {
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.onchange = () => res(i.files[0] || null); i.click(); });
}
const cellISO = c => {
  if (c == null || c === '') return '';

};

    l.sort((a, b) => peso(b) - peso(a) || String(b.fecha_renovacion || b.fecha_matricula || '').localeCompare(String(a.fecha_renovacion || a.fecha_matricula || '')));
